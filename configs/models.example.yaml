providers:
  openrouter:
    api_style: openai_compatible
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    timeout_seconds: 60
    max_retries: 3
    max_concurrency: 5
    headers:
      HTTP-Referer: https://github.com/IreliaNeu/RS-Agent
      X-Title: RS-Agent
  siliconflow:
    api_style: openai_compatible
    base_url: https://api.siliconflow.cn/v1
    api_key_env: SILICONFLOW_API_KEY

caption_generators:
  - name: generator_1
    provider: openrouter
    model: replace-with-model-id-1
  - name: generator_2
    provider: openrouter
    model: replace-with-model-id-2
  - name: generator_3
    provider: openrouter
    model: replace-with-model-id-3
  - name: generator_4
    provider: openrouter
    model: replace-with-model-id-4
  - name: generator_5
    provider: siliconflow
    model: replace-with-model-id-5

selector:
  name: caption_selector
  provider: openrouter
  model: replace-with-selector-model-id
  temperature: 0.0
  max_tokens: 16

evaluator:
  name: caption_evaluator
  provider: openrouter
  model: replace-with-evaluator-model-id
  temperature: 0.0
  max_tokens: 256

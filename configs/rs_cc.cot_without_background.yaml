profile: rs_cc_cot_without_background_v1

protocol:
  track: operational
  baseline_id: rs_cc_cot_background_ablation_v1
  method_variant: cot_without_background
  substitutes_paper_models: true

providers:
  openrouter:
    api_style: openai_compatible
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    timeout_seconds: 60
    max_retries: 1
    max_concurrency: 5
    headers:
      HTTP-Referer: https://github.com/IreliaNeu/RS-Agent
      X-Title: RS-Agent
  siliconflow:
    api_style: openai_compatible
    base_url: https://api.siliconflow.cn/v1
    api_key_env: SILICONFLOW_API_KEY
    timeout_seconds: 45
    max_retries: 1
    max_concurrency: 3

caption_generators:
  - name: Mistral-Small-2603
    provider: openrouter
    model: mistralai/mistral-small-2603
  - name: DeepSeek-V3
    provider: siliconflow
    model: deepseek-ai/DeepSeek-V3
  - name: Mistral-Small-3.2
    provider: openrouter
    model: mistralai/mistral-small-3.2-24b-instruct
  - name: Qwen3-30B
    provider: siliconflow
    model: Qwen/Qwen3-30B-A3B-Instruct-2507
  - name: LLaMA-4-Maverick
    provider: openrouter
    model: meta-llama/llama-4-maverick

selector:
  name: DeepSeek-V3-Selector
  provider: siliconflow
  model: deepseek-ai/DeepSeek-V3
  max_tokens: 16

evaluator:
  name: DeepSeek-V3-Evaluator
  provider: siliconflow
  model: deepseek-ai/DeepSeek-V3
  max_tokens: 256

prompt_profile: cot_without_background
minimum_successful_candidates: 5

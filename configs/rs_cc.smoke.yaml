profile: rs_cc_operational_smoke_v1

providers:
  openrouter:
    api_style: openai_compatible
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    timeout_seconds: 90
    max_retries: 3
    max_concurrency: 5
    headers:
      HTTP-Referer: https://github.com/IreliaNeu/RS-Agent
      X-Title: RS-Agent
  siliconflow:
    api_style: openai_compatible
    base_url: https://api.siliconflow.cn/v1
    api_key_env: SILICONFLOW_API_KEY
    timeout_seconds: 90
    max_retries: 3
    max_concurrency: 3

caption_generators:
  - name: Mistral-Small-2603
    provider: openrouter
    model: mistralai/mistral-small-2603
    temperature: 0.0
    max_tokens: 256
  - name: DeepSeek-V3
    provider: siliconflow
    model: deepseek-ai/DeepSeek-V3
    temperature: 0.0
    max_tokens: 256
  - name: Mistral-Small-3.2
    provider: openrouter
    model: mistralai/mistral-small-3.2-24b-instruct
    temperature: 0.0
    max_tokens: 256
  - name: Qwen3-30B
    provider: siliconflow
    model: Qwen/Qwen3-30B-A3B-Instruct-2507
    temperature: 0.0
    max_tokens: 256
  - name: LLaMA-4-Maverick
    provider: openrouter
    model: meta-llama/llama-4-maverick
    temperature: 0.0
    max_tokens: 256

selector:
  name: DeepSeek-V3-Selector
  provider: siliconflow
  model: deepseek-ai/DeepSeek-V3
  temperature: 0.0
  max_tokens: 16

evaluator:
  name: DeepSeek-V3-Evaluator
  provider: siliconflow
  model: deepseek-ai/DeepSeek-V3
  temperature: 0.0
  max_tokens: 256

prompt_profile: base
minimum_successful_candidates: 5

profile: icassp_rs_vqa_paper_v1

providers:
  openrouter:
    api_style: openai_compatible
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    timeout_seconds: 90
    max_retries: 3
    max_concurrency: 5
    headers:
      HTTP-Referer: https://github.com/IreliaNeu/RS-Agent
      X-Title: RS-Agent
  siliconflow:
    api_style: openai_compatible
    base_url: https://api.siliconflow.cn/v1
    api_key_env: SILICONFLOW_API_KEY
    timeout_seconds: 90
    max_retries: 3
    max_concurrency: 2

answer_models:
  - name: MiniMax-01
    provider: openrouter
    model: minimax/minimax-01
    temperature: 0.0
    max_tokens: 256
  - name: GPT-4o-mini
    provider: openrouter
    model: openai/gpt-4o-mini
    temperature: 0.0
    max_tokens: 256
  - name: LLaMA-4-Maverick
    provider: openrouter
    model: meta-llama/llama-4-maverick
    temperature: 0.0
    max_tokens: 256
  - name: Qwen2.5-VL-32B-Instruct
    provider: siliconflow
    model: Qwen/Qwen2.5-VL-32B-Instruct
    temperature: 0.0
    max_tokens: 256
  - name: Mistral-Small-3.2-24B-Instruct
    provider: openrouter
    model: mistralai/mistral-small-3.2-24b-instruct
    temperature: 0.0
    max_tokens: 256

selector:
  name: GPT-4o-Selector
  provider: openrouter
  model: openai/gpt-4o
  temperature: 0.0
  max_tokens: 16

evaluator:
  name: GPT-4o-Evaluator
  provider: openrouter
  model: openai/gpt-4o
  temperature: 0.0
  max_tokens: 256

default_template_ids:
  - change_summary
  - change_presence
  - spatial_location
minimum_successful_answers_per_question: 5

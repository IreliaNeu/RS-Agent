profile: rs_cc_paper_method_image_text_v1

protocol:
  track: enhancement
  baseline_id: icassp_rs_cc_paper_v1
  method_variant: paper_method_image_pair_plus_caption_interpretation
  substitutes_paper_models: true

providers:
  openrouter:
    api_style: openai_compatible
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    timeout_seconds: 60
    max_retries: 1
    max_concurrency: 5
    headers:
      HTTP-Referer: https://github.com/IreliaNeu/RS-Agent
      X-Title: RS-Agent
  siliconflow:
    api_style: openai_compatible
    base_url: https://api.siliconflow.cn/v1
    api_key_env: SILICONFLOW_API_KEY
    timeout_seconds: 45
    max_retries: 1
    max_concurrency: 2

caption_generators:
  - name: Qwen3-VL-8B-Instruct
    provider: openrouter
    model: qwen/qwen3-vl-8b-instruct
    input_mode: image_text
    temperature: 0.0
    max_tokens: 256
  - name: Gemma-3-27B-IT
    provider: openrouter
    model: google/gemma-3-27b-it
    input_mode: image_text
    temperature: 0.0
    max_tokens: 256
  - name: LLaMA-4-Maverick
    provider: openrouter
    model: meta-llama/llama-4-maverick
    input_mode: image_text
    temperature: 0.0
    max_tokens: 256
  - name: Qwen3-VL-30B-A3B-Instruct
    provider: siliconflow
    model: Qwen/Qwen3-VL-30B-A3B-Instruct
    input_mode: image_text
    temperature: 0.0
    max_tokens: 256
  - name: Qwen2.5-VL-72B-Instruct
    provider: openrouter
    model: qwen/qwen2.5-vl-72b-instruct
    input_mode: image_text
    temperature: 0.0
    max_tokens: 256

selector:
  name: Qwen3-30B-Selector
  provider: siliconflow
  model: Qwen/Qwen3-30B-A3B-Instruct-2507
  temperature: 0.0
  max_tokens: 16

evaluator:
  name: Qwen3-30B-Evaluator
  provider: siliconflow
  model: Qwen/Qwen3-30B-A3B-Instruct-2507
  temperature: 0.0
  max_tokens: 256

prompt_profile: base
minimum_successful_candidates: 4

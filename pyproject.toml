[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rs-agent"
version = "0.1.0"
description = "Multi-agent remote-sensing image change understanding pipeline"
readme = "README.md"
requires-python = ">=3.9,<3.12"
dependencies = [
  "httpx>=0.27,<1",
  "openai>=1.30,<2",
  "pillow>=10,<12",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "pyyaml>=6,<7",
  "tenacity>=8.2,<10",
]

[project.optional-dependencies]
evaluation = [
  "numpy>=1.24,<2",
  "openpyxl>=3.1,<4",
  "pandas>=2,<3",
]
workflow = ["langgraph>=0.2,<1"]
web = ["streamlit>=1.32,<2"]
dev = [
  "pytest>=8,<9",
  "ruff>=0.5,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
